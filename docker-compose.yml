services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitalify-api:dev
    container_name: vitalify-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    # Mismo .env que usa `dotnet run` (cadenas de conexión de Supabase).
    env_file:
      - .env
    restart: unless-stopped

  # Fase 7: aquí se agregarán `timescaledb` (historial de signos vitales, reemplaza a
  # Supabase para HistorialDbContext) y `mosquitto` (broker MQTT para los wearables ESP32).
