# Mosquitto de producción de Vitalify (docker-compose.prod.yml). Mismo ACL que el broker del proyecto IoT
# (IOT/tesis_V01/broker), más las solicitudes de los wearables.
#
#   wearables (ESP32) ── TLS, puerto 8883 (publicado) ──┐
#                                                       ├── Mosquitto
#   API (vitalify-backend) ── mosquitto:1883 (red interna de Docker, sin publicar) ──┘
#
# iniciar.sh copia este archivo, el ACL y el certificado de Caddy a rutas que el usuario "mosquitto" puede leer
# (Mosquitto 2 suelta los privilegios antes de cargar los certificados).

per_listener_settings false

# Solo para la red interna de Docker: el puerto no se publica en el servidor, así que desde fuera no se llega.
listener 1883
protocol mqtt

# Para los wearables, desde Internet: TLS con el certificado de Let's Encrypt que obtiene Caddy para el dominio.
listener 8883
protocol mqtt
certfile /mosquitto/certs/certificado.pem
keyfile /mosquitto/certs/clave.pem
tls_version tlsv1.2

# Sin anónimos: cada cliente entra con usuario y clave (password_file, creado con mosquitto_passwd; fuera de git) y el
# ACL limita qué tópicos puede usar cada uno.
allow_anonymous false
password_file /mosquitto/secretos/passwd
acl_file /mosquitto/config/acl

# Los retenidos (online/offline, QR, vinculado) y los QoS 1 pendientes sobreviven a un reinicio. El backend usa sesión
# persistente: el broker le guarda lo que llegue mientras está caído.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
