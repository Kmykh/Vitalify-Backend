name: CI

on:
  push:
  pull_request:

jobs:
  build-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Vitalify.sln

      - name: Compilar
        run: dotnet build Vitalify.sln --no-restore -c Release

      # No necesita base de datos: son pruebas unitarias y de arquitectura.
      - name: Pruebas
        run: dotnet test Vitalify.sln --no-build -c Release --verbosity normal
